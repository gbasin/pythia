# How each (provider, model) cell of the panel is invoked.
# The orchestrator looks up entries by id, then builds an argv list using
# `cli_command [subcommand] args...` and pipes the assembled prompt via stdin.
#
# Model policy: each leg runs the provider's CURRENT top model for the
# surface via a floating alias or default (claude: `--model opus`; codex:
# CLI built-in default; gemini: `gemini-flash-latest`). `model_name` below
# records what that resolved to as of the last config edit; the model that
# actually served each response is captured in
# responses.model_name_reported (where the trace reports it).
#
# v1.1: tools_off variants were dropped. Both providers run with web search
# enabled — that's the "real" surface real users get from these CLIs and
# the only one whose recommendations are anchored in current market state.
# The tools_state column remains on the responses table for legacy data.

model_configs:
  - id: claude_opus
    provider: claude
    cli_command: claude
    subcommand: null
    model_name: claude-opus-4-8
    args:
      - "-p"
      - "--output-format"
      - "stream-json"
      - "--verbose"
      - "--model"
      - "opus"
      - "--setting-sources"
      - "project"
      - "--disable-slash-commands"
      - "--no-session-persistence"
      - "--permission-mode"
      - "bypassPermissions"
      - "--allowed-tools"
      - "WebSearch WebFetch"
    tools_state: "on"
    trace_format: claude-stream-json
    notes: |
      Default-tooled Claude Code coding-agent surface, constrained to
      WebSearch + WebFetch only via --allowed-tools. --permission-mode
      bypassPermissions is REQUIRED — without it the default permission
      mode denies WebSearch in non-interactive runs. Without the
      --allowed-tools constraint, claude was firing ToolSearch / Write /
      Bash during stock-recommendation prompts (wasted turns + bloated
      traces). `--model opus` floats to the newest Opus; the resolved id
      lands in responses.model_name_reported (the alias rolled 4.7→4.8
      on 2026-05-29 without a config change).

  - id: codex_gpt55
    provider: codex
    cli_command: codex
    subcommand: exec
    model_name: gpt-5.5
    args:
      - "--skip-git-repo-check"
      - "--json"
      - "--ephemeral"
      - "--ignore-user-config"
      - "--ignore-rules"
      - "--sandbox"
      - "read-only"
    tools_state: "on"
    trace_format: codex-jsonl
    notes: |
      Codex CLI coding-agent surface. read-only sandbox so the model can't
      mutate files but can still web-search and inspect. --ephemeral so
      session files aren't persisted. --ignore-user-config + --ignore-rules
      for clean baseline. Codex's web_search is hardcoded into the engine
      (no documented way to disable in this version). No --model flag, so
      runs the CLI's built-in default (gpt-5.5 on codex-cli 0.139.0, as of
      2026-06); the --json event stream doesn't report the model, so
      model_name_reported stays NULL for this leg.

  - id: gemini_flash
    provider: gemini
    cli_command: uv
    subcommand: run
    model_name: gemini-3.5-flash
    args:
      - "scripts/gemini_panel_call.py"
      - "--model"
      - "gemini-flash-latest"
    tools_state: "on"
    trace_format: gemini-jsonl
    notes: |
      Direct Gemini API via google-genai SDK with Google Search grounding
      enabled. Pay-per-token through GEMINI_API_KEY (loaded from .env by
      daily_run.sh). Independent of any Antigravity / Google AI Pro/Ultra
      subscription quota — added to replace agy_flash35 after the
      subscription weekly-cap lockout. Wrapper emits JSONL events parsed by
      parse_gemini_jsonl(). Grounding citations are captured in the raw
      trace as "grounding" events for later inspection. `gemini-flash-latest`
      floats to the newest stable Flash (gemini-3.5-flash as of 2026-06);
      the wrapper reports the resolved resp.model_version, which lands in
      responses.model_name_reported.
