# pythia health-check thresholds + alert routing.
# Consumed by scripts/health_check.py at the end of every daily run.
#
# Two severities:
#   critical -> something is broken now; pushed to your phone via ntfy AND
#               filed as a GitHub issue.
#   warn     -> quality drift worth triaging at the desk; GitHub issue only.
#
# Secrets (ntfy topic) come from the environment, never this file.

baseline_days: 7        # prior clean runs used to compute drift baselines
fresh_run_max_age_h: 26 # if no clean run newer than this -> critical "no run"

checks:
  # A provider that returned zero successful responses in the latest run.
  # Catches the codex-auth-token-death class of outage.
  provider_blackout:
    severity: critical

  # Fraction of the latest run's tuples that errored.
  run_failure_rate:
    severity: critical
    max: 0.15

  # Latest run's mentions-per-successful-response vs the baseline median.
  # Catches format/extraction breakage (e.g. the $TICKER directive stops
  # being honored) even when nothing errors.
  mentions_per_response:
    severity: warn
    min_ratio: 0.5

  # Classifier rows parked in needs_review (bad/unparseable judge output),
  # as a fraction of the latest run's mentions.
  classifier_needs_review:
    severity: warn
    max_ratio: 0.05

  # Alpha benchmark falling behind. Two independent signals, fires on either:
  #   max_sessions  - priced SPY sessions that exist but haven't been scored
  #                   into forward returns (catches a downstream stall while the
  #                   price fetch still works). 1 is normal; 2+ is stuck.
  #   max_age_days  - calendar days between today and the newest scored session
  #                   (catches a TOTAL stall — yfinance down, benchmark crash —
  #                   where SPY itself is also frozen so max_sessions reads 0).
  #                   Tolerant of long weekends/holidays.
  alpha_lag:
    severity: warn
    max_sessions: 1
    max_age_days: 5

  # Published dashboard (GitHub Pages) falling behind the database — i.e.
  # the gh-pages push in publish_pages.sh failing while everything upstream
  # stays green. behind = db's latest day minus the day in the live page's
  # title. 1 day behind is tolerated (Pages CDN/build latency right after
  # the push); 2+ means the push has failed on consecutive nights.
  pages_stale:
    severity: warn
    url: https://gbasin.github.io/pythia/
    max_behind_days: 1

transports:
  ntfy:
    enabled: true
    # Topic is read from this env var (set in .env). If unset, ntfy is skipped.
    topic_env: PYTHIA_NTFY_TOPIC
    server: https://ntfy.sh
  gh_issue:
    enabled: true
    # Repo slug ("owner/name") is read from this env var (set yours in .env).
    # If unset, issue filing is skipped — so cloning and running this never
    # files issues into someone else's repo. The label must exist on the
    # repo (`gh label create pythia-health`).
    repo_env: PYTHIA_HEALTH_REPO
    label: pythia-health
